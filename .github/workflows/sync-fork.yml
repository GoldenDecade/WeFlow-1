name: Sync fork with upstream

on:
  schedule:
    - cron: '0 18 * * *'   # UTC 18:00 = 北京时间每天凌晨 2 点
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/hicccc77/WeFlow.git
          git fetch upstream main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge upstream/main --no-edit || { echo "::warning::Merge conflict, manual resolution needed"; exit 0; }
          git push origin main
